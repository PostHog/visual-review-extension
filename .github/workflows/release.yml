name: Release

# Push a tag matching the manifest version (e.g. v0.2.0) to publish an installable zip.
on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Check the tag matches the manifest version
              run: |
                  version=$(node -p "require('./src/manifest.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
                      exit 1
                  fi

            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm zip

            # A fixed asset name keeps releases/latest/download/posthog-visual-review.zip stable.
            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" posthog-visual-review.zip --generate-notes --title "$GITHUB_REF_NAME"
