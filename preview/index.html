<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* A slice of GitHub's Primer variables so the preview looks like the real page. */
            body[data-theme='light'] {
                --bgColor-default: #ffffff; --bgColor-muted: #f6f8fa; --fgColor-default: #1f2328; --fgColor-muted: #59636e;
                --borderColor-default: #d1d9e0; --borderColor-muted: #d1d9e0b3; --fgColor-accent: #0969da;
                --bgColor-neutral-muted: #818b981f; --progressBar-track-bgColor: #d1d9e0; --fgColor-onEmphasis: #ffffff;
                --bgColor-success-emphasis: #1f883d; --bgColor-attention-emphasis: #9a6700;
                --bgColor-danger-emphasis: #cf222e; --bgColor-neutral-emphasis: #59636e;
                --overlay-bgColor: #ffffff;
                --shadow-floating-small: 0 0 0 1px #d1d9e080, 0 6px 12px -3px #25292e0a, 0 6px 18px 0 #25292e1f;
            }
            body[data-theme='dark'] {
                --bgColor-default: #0d1117; --bgColor-muted: #151b23; --bgColor-neutral-muted: #656c7633;
                --fgColor-default: #f0f6fc; --fgColor-muted: #9198a1; --fgColor-accent: #4493f8;
                --borderColor-default: #3d444d; --borderColor-muted: #3d444db3;
                --fgColor-success: #3fb950; --fgColor-attention: #d29922; --fgColor-danger: #f85149;
                --bgColor-success-muted: #2ea04326; --bgColor-attention-muted: #bb800926; --bgColor-danger-muted: #f851491a;
                --borderColor-success-muted: #2ea04366; --borderColor-attention-muted: #bb800966; --borderColor-danger-muted: #f8514966;
                --button-default-fgColor-rest: #f0f6fc; --button-default-bgColor-rest: #212830; --button-default-bgColor-hover: #262c36;
                --button-default-borderColor-rest: #3d444d; --button-default-borderColor-hover: #3d444d;
                --button-primary-bgColor-rest: #238636; --button-primary-bgColor-hover: #29903b; --button-primary-borderColor-rest: #ffffff1a;
                --button-invisible-bgColor-hover: #656c7633;
                --progressBar-track-bgColor: #3d444d; --fgColor-onEmphasis: #ffffff;
                --bgColor-success-emphasis: #238636; --bgColor-attention-emphasis: #9e6a03;
                --bgColor-danger-emphasis: #da3633; --bgColor-neutral-emphasis: #656c76;
                --overlay-bgColor: #151b23;
                --shadow-floating-small: 0 0 0 1px #3d444d, 0 6px 12px -3px #01040966, 0 6px 18px 0 #01040966;
            }
            body { margin: 0; background: var(--bgColor-default); color: var(--fgColor-default);
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
            .gh-page { width: fit-content; margin: 0 auto; padding: 16px 32px 40px; }
            .state-name { font: 600 11px/1 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .06em; color: #d63384; margin: 28px 0 8px; }
            /* GitHub's merge box, as far as the tile's neighbors go. */
            .gh-merge { width: 900px; }
            .gh-merge.narrow { width: 600px; }
            .gh-mergebox { border: 1px solid var(--borderColor-default); border-radius: 6px; }
            .gh-recommended { display: flex; flex-direction: column; gap: 2px; padding: 16px; font-size: 14px;
                border-bottom: 1px solid var(--borderColor-default); }
            .gh-recommended span { font-size: 12px; color: var(--fgColor-muted); }
            .gh-grid { container-type: inline-size; }
            .gh-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .gh-tile { min-width: 0; padding: 6px 16px 16px; background: var(--bgColor-muted); font-size: 14px; }
            .gh-tile ~ .gh-tile { border-left: 1px solid var(--borderColor-default); }
            .gh-tile:first-child { border-bottom-left-radius: 6px; }
            @container (width < 768px) {
                .gh-tiles { grid-template-columns: minmax(0, 1fr); }
                .gh-tile ~ .gh-tile { border-left: 0; border-top: 1px solid var(--borderColor-default); }
                .gh-tile:first-child { border-bottom-left-radius: 0; }
            }
            .gh-tile-label { display: flex; align-items: center; gap: 6px; min-height: 26px; }
            .gh-tile-label strong { font-size: 13px; }
            .gh-tile-summary { font-size: 12px; color: var(--fgColor-muted); }
            .gh-bar { display: flex; height: 8px; margin-top: 2px; border-radius: 3px; overflow: hidden;
                background: var(--progressBar-track-bgColor); }
            .gh-segment + .gh-segment { border-left: 1px solid var(--fgColor-onEmphasis); }
            .gh-success { background: var(--bgColor-success-emphasis); }
            .gh-neutral { background: var(--bgColor-neutral-emphasis); }
            .gh-attention { background: var(--bgColor-attention-emphasis); }
            .gh-bar-unavailable { height: 8px; margin-top: 2px; border: 1px solid var(--borderColor-muted); border-radius: 9999px;
                background: var(--bgColor-neutral-muted) repeating-linear-gradient(135deg, transparent 0, transparent 2px,
                var(--bgColor-default) 2px, var(--bgColor-default) 4px); }
            [hidden] { display: none !important; }
            .hidden-state { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 6px;
                border: 1px dashed var(--borderColor-default); border-radius: 6px; font-size: 13px; color: var(--fgColor-muted); }
            .hidden-state::before { content: '∅'; font-weight: 600; }
            body.popup-preview { width: 360px; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script src="preview.js"></script>
    </body>
</html>
